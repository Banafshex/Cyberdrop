name: android

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".ci/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Cyberdrop-1.0.0.apk
          ls -l out
          sha256sum out/*.apk | tee out/SHA256.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cyberdrop-apk
          path: out/*

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || \
            gh release create v1.0.0 --title "Cyberdrop 1.0.0" --notes "APK امضاشدهٔ اپلیکیشن Cyberdrop — انتقال فایل P2P بدون سرور."
          gh release upload v1.0.0 out/Cyberdrop-1.0.0.apk out/SHA256.txt --clobber

      - name: Publish build log
        if: always()
        run: bash .ci-tools/log.sh build.log build-log.txt

  # نسخهٔ عیب‌یابی برای تست سریع (بدون ریلیز)
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee debug.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cyberdrop-debug
          path: app/build/outputs/apk/debug/*.apk
