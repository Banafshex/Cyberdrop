name: probe
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: [".github/workflows/probe.yml", ".ci-tools/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: run
        run: bash .ci-tools/probe.sh > /tmp/probe.txt 2>&1 || echo "STEP FAILED" >> /tmp/probe.txt
      - name: publish
        if: always()
        run: bash .ci-tools/log.sh /tmp/probe.txt probe.txt
