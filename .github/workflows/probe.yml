name: probe
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: [".github/workflows/probe.yml", ".ci-tools/**"]
permissions:
  contents: write
  issues: write
env:
  REPO: ${{ github.repository }}
  CI_ISSUE: "1"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: bash .ci-tools/probe.sh > /tmp/out.txt 2>&1 || echo "STEP FAILED rc=$?" >> /tmp/out.txt
      - name: report
        if: always()
        run: python3 .ci-tools/report.py /tmp/out.txt
