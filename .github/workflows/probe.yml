name: probe
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: [".github/workflows/probe.yml", ".ci-tools/**"]
permissions:
  contents: write
  issues: write
  checks: write
env:
  REPO: ${{ github.repository }}
  CI_ISSUE: "1"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: bash .ci-tools/probe.sh > /tmp/out.txt 2>&1 || echo "STEP FAILED rc=$?" >> /tmp/out.txt
      - name: annotate
        if: always()
        run: |
          python3 - <<'PY'
          data = open('/tmp/out.txt', encoding='utf-8', errors='replace').read()[-52000:]
          for i in range(0, len(data), 6000):
              chunk = data[i:i+6000].replace('%','%25').replace('\r','').replace('\n','%0A')
              print("::error title=ci-log-%d::%s" % (i//6000, chunk))
          PY
      - name: comment
        if: always()
        continue-on-error: true
        run: python3 .ci-tools/report.py /tmp/out.txt 2>&1 | tail -20
